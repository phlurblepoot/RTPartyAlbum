services:
  rtpartyalbum:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtpartyalbum:latest
    container_name: rtpartyalbum
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    volumes:
      - ./.docker-data:/data
      - ./.docker-uploads:/uploads
