name: build-and-publish

# Builds the server, runs the test suite, and publishes a multi-stage Docker
# image to GitHub Container Registry (GHCR) so it can be pulled onto the Unraid box.
#
# NOTE (current state): only the backend API is built. The web UI (guest upload page,
# gliding-canvas display, admin console) is not implemented yet — the container serves
# the JSON API at /api/*, media at /media/*, and Socket.IO, but the root URL has no
# visual app until later milestones.

on:
  push:
    branches: [build/mvp, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full workspace test suite (shared + server). Informational: it does NOT gate the
  # image, because the Docker build itself recompiles the code and fails if it can't
  # build. This keeps a flaky CI media-tool difference from blocking a deployable image.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @rtpa/shared
      - run: npm test -w @rtpa/shared
      - run: npm test -w @rtpa/server
      - run: npm run build -w @rtpa/server

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Login is only needed when we actually push (not on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name (repo is RTPartyAlbum -> rtpartyalbum)
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push on branch/tag pushes and manual runs; build-only on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
